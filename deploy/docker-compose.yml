# BrunoPlay v4 on one VPS: PostgreSQL, the API, the worker (and Caddy, only when asked for). Backups are dumps taken by backup.sh.
# Usage: copy .env.example to .env and fill it in, copy deploy/.env.deploy.example to deploy/.env, run ./build-web.sh, then ./deploy.sh
name: brunoplay

x-app: &app
  image: brunoplay:${VERSION:-latest}
  build:
    context: ..
    args:
      VERSION: ${VERSION:-dev}
  env_file: ../.env
  restart: unless-stopped
  depends_on:
    migrate:
      condition: service_completed_successfully
  logging:
    driver: json-file
    options: {max-size: "20m", max-file: "5"}

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: brunoplay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: brunoplay
      # every data page carries a checksum, so disk corruption is noticed instead of silently read. It can only be switched on
      # when the database is created for the first time.
      POSTGRES_INITDB_ARGS: "--data-checksums"
      TZ: UTC
    # Settings for a server of about 4 CPUs and 8 GB shared with other things; change PG_SHARED_BUFFERS in deploy/.env for a bigger or smaller one.
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-768MB}
      - -c
      - effective_cache_size=${PG_CACHE_SIZE:-2GB}
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      # the API and the worker use up to 20 each, plus migrations, backups and you
      - max_connections=60
      - -c
      # SSD: random reads cost about the same as sequential ones
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - synchronous_commit=on                                    # a committed money operation survives a crash
      - -c
      - wal_compression=on
      - -c
      # the transaction log is recycled after a checkpoint and stays under this size: it is not archived, so it cannot pile up
      - max_wal_size=2GB
      - -c
      - min_wal_size=256MB
      - -c
      - checkpoint_timeout=10min
      - -c
      - timezone=UTC
      - -c
      - log_timezone=UTC
      - -c
      # log every query slower than one second, every checkpoint and every wait for a lock
      - log_min_duration_statement=1000
      - -c
      - log_checkpoints=on
      - -c
      - log_lock_waits=on
      - -c
      # a transaction left open by mistake would hold locks forever: close it after two minutes
      - idle_in_transaction_session_timeout=120000
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brunoplay -d brunoplay"]
      interval: 5s
      timeout: 3s
      retries: 20
    shm_size: 256mb

  migrate:
    <<: *app
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["migrate"]

  api:
    <<: *app
    command: ["api"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 6
    expose: ["8080"]
    # for a reverse proxy running on the server itself (nginx): reachable from this machine only, never from outside
    ports: ["127.0.0.1:${API_PORT:-8085}:8080"]

  worker:
    <<: *app
    command: ["worker"]

  caddy:
    image: caddy:2
    restart: unless-stopped
    # only started with COMPOSE_PROFILES=caddy (deploy/.env). With nginx on the server leave it off.
    profiles: ["caddy"]
    ports: ["80:80", "443:443"]
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-app.invalid}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:-admin.invalid}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${WWW_DIR:-/opt/brunoplay/www}/app:/srv/app:ro
      - ${WWW_DIR:-/opt/brunoplay/www}/admin:/srv/admin:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
  caddy_config:
