# Admin panel site (host nginx). Copy to /etc/nginx/sites-available/brunoplay-admin; certbot already added the certificate.
server {
    server_name brunoplay-admin.duckdns.org;

    client_max_body_size 2m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css text/plain application/javascript text/javascript application/json image/svg+xml;

    root /opt/brunoplay/www/admin;
    index index.html;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options "DENY" always;

    location /api/ {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri $uri/ /index.html;
    }

    listen [::]:443 ssl http2;
    listen 443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/brunoplay-admin.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/brunoplay-admin.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name brunoplay-admin.duckdns.org;
    return 301 https://$host$request_uri;
}
