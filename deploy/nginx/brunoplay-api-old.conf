# Retired address: sends everything to the new name. Copy to /etc/nginx/sites-available/brunoplay-api (certificate stays).
server {
    server_name brunoplay-api.duckdns.org;

    listen [::]:443 ssl http2;
    listen 443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/brunoplay-api.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/brunoplay-api.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://brunoplay.duckdns.org$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name brunoplay-api.duckdns.org;
    return 301 https://brunoplay.duckdns.org$request_uri;
}
