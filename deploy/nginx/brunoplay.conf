# Game + API site (host nginx). Copy to /etc/nginx/sites-available/brunoplay; the certificate paths are the ones certbot created.
# Speed: HTTP/2 (many small files over one connection), compression for text, and long caching for the files whose names
# change on every build (/assets/), so a returning player downloads almost nothing.
server {
    server_name brunoplay.duckdns.org;

    client_max_body_size 2m;

    root /opt/brunoplay/www/app;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css text/plain application/javascript text/javascript application/json image/svg+xml application/manifest+json;

    add_header X-Content-Type-Options "nosniff" always;

    location /api/ {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /readyz  { proxy_pass http://127.0.0.1:8085; }
    location = /healthz { proxy_pass http://127.0.0.1:8085; }

    # hashed file names: never change, so the phone keeps them for a year
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # fonts keep their names between builds: a month
    location /fonts/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # the page itself is always checked, so a new build is picked up on the next open
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri $uri/ /index.html;
    }

    listen [::]:443 ssl http2;
    listen 443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/brunoplay.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/brunoplay.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name brunoplay.duckdns.org;
    return 301 https://$host$request_uri;
}
